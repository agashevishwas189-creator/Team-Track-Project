
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-track-ingress
  namespace: team-track
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: team-track-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: team-track-frontend
                port:
                  number: 80

