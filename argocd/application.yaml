apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-track
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/agashevishwas189-creator/Team-Track-Project.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: team-track
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
